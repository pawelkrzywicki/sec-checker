services:
  history-checker:
    build: .
    ports:
      - "${SEC_CHECKER_BIND_IP:-0.0.0.0}:8787:8787"
    environment:
      SEC_CHECKER_PASSWORD: "${SEC_CHECKER_PASSWORD:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: "no"
