<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sec Checker report</title></head><body><h1>Site exposure report</h1><p>Generated {{ stamp }}</p><p>{{ notice }}</p><table border="1" cellpadding="10"><thead><tr><th>Domain</th><th>TLS</th><th>PHP</th><th>Evidence</th><th>Error</th></tr></thead><tbody>{% for r in results %}<tr><td>{{ r.host }}</td><td>{{ r.tls }}</td><td>{{ r.php.status }}</td><td>{{ r.php.evidence }}</td><td>{{ r.get('error','') }}</td></tr>{% endfor %}</tbody></table><h2>Sources</h2><ul>{% for source in sources %}<li><a href="{{ source }}">{{ source }}</a></li>{% endfor %}</ul></body></html>
